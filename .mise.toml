[settings]
minimum_release_age = "7d"

[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
SOPS_AGE_KEY_FILE = "$HOME/.config/sops/age/keys.txt"
TALOSCONFIG = "{{config_root}}/kubernetes/bootstrap/talos/clusterconfig/talosconfig"
KUBECONFIG = "$HOME/.kube/config"

[tasks.deps]
description = "Install dependencies"
run = "uv pip install -r requirements.txt"

[tools]
"aqua:budimanjojo/talhelper" = "3.1.15"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:fluxcd/flux2" = "2.9.3"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.2.3"
"aqua:helmfile/helmfile" = "1.7.1"
"aqua:jqlang/jq" = "1.8.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:kubernetes/kubectl" = "1.34.1"
"aqua:mikefarah/yq" = "4.53.3"
"aqua:siderolabs/talos" = "1.13.5"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:cilium/cilium-cli" = "0.19.6"
