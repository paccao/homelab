---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./longhorn/ks.yaml
  - ./settings/ks.yaml
components:
  - ../../flux/components/namespace
patches:
  - # Add the name to the namespace
    patch: |
      - op: add
        path: /metadata/name
        value: longhorn-system
      - op: add
        path: /metadata/labels
        value: {}
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: privileged
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1enforce-version
        value: latest
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1audit
        value: baseline
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1audit-version
        value: latest
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1warn
        value: privileged
      - op: add
        path: /metadata/labels/pod-security.kubernetes.io~1warn-version
        value: latest
    target:
      kind: Namespace
