---
cgroup:
  automount:
    enabled: false
  hostRoot: /sys/fs/cgroup
ipam:
  mode: kubernetes
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 75m
    memory: 256Mi

# cilium without kube-proxy
socketLB:
  enabled: true
k8sServiceHost: localhost
k8sServicePort: 7445

# L2 IPAM
l2announcements:
    enabled: true
    leaseDuration: 10s
    leaseRenewDeadline: 5s
    leaseRetryPeriod: 1s
l2NeighDiscovery:
    enabled: true
k8sClientRateLimit: # Client rate limits to prevent flooding the K8s API
    # How to calculate: QPS = N services * (1 / leaseRenewDeadline)
    qps: 5 # default 10
    burst: 10 # default 20
devices:
  - end0
  - enp1s0

operator:
  replicas: 1
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 128Mi
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

envoy:
  enabled: false
dashboards:
  enabled: true
hubble:
  enabled: false
