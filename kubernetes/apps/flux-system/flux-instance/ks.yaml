---
# yaml-language-server: $schema=https://k8s-schemas.mirceanton.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
spec:
  targetNamespace: flux-system

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  commonMetadata:
    labels:
      app.kubernetes.io/name: flux-instance

  path: ./kubernetes/apps/flux-system/flux-instance/app
  prune: false # Never delete this
  wait: false
  interval: 1h

  postBuild:
    substitute: {}

  dependsOn:
    - name: flux-operator
