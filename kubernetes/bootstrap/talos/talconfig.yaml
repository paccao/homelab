controlPlane:
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers: ""
  nameservers:
    - 1.1.1.1
    - 8.8.8.8
    # - 194.242.2.4 # Mullvad DNS (Warning - DoH or DoT ONLY)
  patches:
    - "@./patches/controller/machine.yaml"
    - "@./patches/controller/cluster.yaml"

worker:
  nameservers:
    - 1.1.1.1
    - 8.8.8.8

# Global
patches:
  - "@./patches/global/kubelet.yaml"
