---
cluster:
  coreDNS:
    disabled: true
  # Cilium requires this
  network:
    cni:
      name: none
  # disable kube-proxy - let Cilium handle it instead
  proxy:
    disabled: true
  scheduler:
    config:
      apiVersion: kubescheduler.config.k8s.io/v1
      kind: KubeSchedulerConfiguration
      profiles:
        - schedulerName: default-scheduler
          plugins:
            score:
              disabled:
                # We use spegel so we don't need image locality
                - name: ImageLocality
